[package]
name = "housewright-web"
description = "The Housewright core compiled to WebAssembly, with SQLite on OPFS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
housewright-api.workspace = true
housewright-core.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
jiff = { workspace = true, features = ["js"] }
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
