name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (WebAssembly)
        run: cargo clippy -p housewright-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The interface imports the generated web/pkg bindings, so build the
      # WebAssembly package before type-checking.
      - name: WebAssembly package
        run: npm run wasm
      - name: TypeScript and Svelte check
        run: npm run check
      - name: Unit tests (vitest)
        run: npm test
      - name: Web bundle
        run: npm run build:web
      - name: End-to-end (Playwright, Chromium)
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium npx playwright test

  # Android debug build. Manual only for now: it is slow and has not yet been
  # run on GitHub's runners.
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;30.0.16248370" "platforms;android-36" "build-tools;36.1.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build debug APK (x86_64)
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: |
          npm ci
          cargo tauri android build --debug --target x86_64 --apk
