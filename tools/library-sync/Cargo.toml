[package]
name = "housewright-library-sync"
description = "Copies a pinned version of the appliance library into library/, checks it, and builds release bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "library-sync"
path = "src/main.rs"

[dependencies]
housewright-core.workspace = true
serde_json.workspace = true
flate2.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
