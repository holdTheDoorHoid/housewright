[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/api",
    "crates/media",
    "crates/binder",
    "web",
    "web-binder",
    "tools/climate-build",
]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/holdTheDoorHoid/housewright"
rust-version = "1.92"

[workspace.dependencies]
housewright-core = { path = "crates/core" }
housewright-api = { path = "crates/api", default-features = false }
housewright-media = { path = "crates/media" }
housewright-binder = { path = "crates/binder", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
# Date/time: see the comment at the top of crates/core/src/schedule.rs for why jiff.
jiff = { version = "1", features = ["serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
# Phase 4 records (licences in docs/THIRD-PARTY.md).
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
rqrr = "0.11"
pdf-writer = "0.15"
ocrs = { version = "0.14", default-features = false, features = ["onnx"] }
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }

# Pixel and model code is unusably slow unoptimised (OCR takes minutes in a
# debug build); optimise just these dependencies in dev and test builds.
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
rqrr = { opt-level = 3 }
ocrs = { opt-level = 3 }
rten = { opt-level = 3 }
rten-base = { opt-level = 3 }
rten-gemm = { opt-level = 3 }
rten-simd = { opt-level = 3 }
rten-tensor = { opt-level = 3 }
rten-vecmath = { opt-level = 3 }
rten-imageproc = { opt-level = 3 }
rten-sequence = { opt-level = 3 }
rten-onnx = { opt-level = 3 }
# The binder's typesetter (D-80): unoptimised, a 30-page binder takes tens
# of seconds, which matters most in the debug APK on the emulator.
typst-library = { opt-level = 2 }
typst-layout = { opt-level = 2 }
typst-realize = { opt-level = 2 }
typst-eval = { opt-level = 2 }
typst-pdf = { opt-level = 2 }
typst-syntax = { opt-level = 2 }
typst-utils = { opt-level = 2 }
krilla = { opt-level = 2 }
rustybuzz = { opt-level = 2 }
ttf-parser = { opt-level = 2 }
comemo = { opt-level = 2 }
