[[facts]]
topic = "service"
text = "The unit ships with no oil in the engine, so fill it to the mark before the first start. The first oil change is due at 20 hours, and the regular service table works by months or hours, whichever comes first."
source = "https://cdn.powerequipment.honda.com/pe/pdf/manuals/00X31Z446010.pdf"
