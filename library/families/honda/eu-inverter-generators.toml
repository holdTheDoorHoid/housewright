[[facts]]
topic = "service"
text = "Oil grade is SAE 10W-30 for general use and the crankcase holds only about 14 ounces, so a small amount of overfill or underfill matters. Service more often in dusty places."
source = "https://cdn.powerequipment.honda.com/pe/pdf/manuals/00X31Z446010.pdf"
