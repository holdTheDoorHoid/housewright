[[facts]]
topic = "anti-tip"
text = "Samsung ranges must be held by an anti-tip device hooked at a back corner of the base. To test, hold the top back edge and try tipping the range toward you; it should stop after a few inches. Check again after any move, and never take the leveling legs off fully."
source = "https://www.samsung.com/us/support/legal/LGL10000309/"

[[facts]]
topic = "self-clean"
text = "Self Clean cannot be started while the warming drawer is on (on models that have one) or while any cooktop burner or element is in use."
source = "https://www.samsung.com/us/support/troubleshoot/TSG10002418/"

[[facts]]
topic = "gas smell"
text = "Samsung's gas advice: do not light any appliance, flip any electrical switch, touch the range or its cord, or start the vent fan. Open windows, then phone the gas supplier from a safe distance away from the building, or the fire department if the supplier cannot be reached."
source = "https://www.samsung.com/us/support/legal/LGL10000309/"

