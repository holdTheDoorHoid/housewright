[[facts]]
topic = "filter"
text = "Samsung US gives no fixed filter schedule: clean the filter and drain area whenever debris builds up. Scraping the largest scraps off plates before loading means it needs doing less often."
source = "https://www.samsung.com/us/support/answer/ANS10002330/"

[[facts]]
topic = "filter"
text = "Twist-lock filters come out by turning them counterclockwise and lifting; rinse under the tap and turn clockwise to lock. Handle-lock models: take out the lower rack, unlock the handle, lift out the cylinder filter, rinse and dry both parts, then relock."
source = "https://www.samsung.com/us/support/answer/ANS10002330/"

