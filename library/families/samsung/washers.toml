[[facts]]
topic = "cleaning"
text = "Run the Self Clean cycle roughly monthly or every 30 to 40 loads, only with an empty drum. It takes about an hour on top-loaders and up to four hours on front-loaders."
source = "https://www.samsung.com/us/support/troubleshoot/TSG10007246/"

[[facts]]
topic = "filter"
text = "Front-loaders have a pump filter behind a panel at the bottom front; clean it regularly because a neglected one causes odors. Top-loaders generally have no removable pump filter."
source = "https://www.samsung.com/us/support/troubleshoot/TSG10007246/"

[[facts]]
topic = "care"
text = "Take wet laundry out promptly, wipe the drawer, tub and door seal after loads, and leave the door open so the drum and seal air out."
source = "https://www.samsung.com/us/support/troubleshoot/TSG10007246/"

