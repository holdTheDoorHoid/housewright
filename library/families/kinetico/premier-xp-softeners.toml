[[facts]]
topic = "salt"
text = "Most owners use tablet or block salt; curved salt is only for models that need that shape. Skip rock salt, whose dirt can clog the softener, and ask your Kinetico dealer what to adjust before moving to potassium chloride."
source = "https://resourcecenter.kinetico.com/owners-support/refill-your-water-softener-salt/"

[[facts]]
topic = "salt"
text = "Keep the brine tank 1/2 to 3/4 full on medium or high settings and about 1/2 full on low; filling it to the top can make the salt bridge into a hard crust."
source = "https://resourcecenter.kinetico.com/owners-support/refill-your-water-softener-salt/"

[[facts]]
topic = "salt"
text = "To check, open the brine tank lid: visible water above the salt means it is time to top up."
source = "https://resourcecenter.kinetico.com/owners-support/refill-your-water-softener-salt/"

