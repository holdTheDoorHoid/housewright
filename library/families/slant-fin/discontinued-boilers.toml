text = "Slant/Fin no longer builds boilers or sells parts for them. Its final boilers went to wholesalers in June 2022, after which it dropped replacement-part warranties; anyone who bought a boiler after September 2023 should ask the wholesaler about part warranties."
source = "https://slantfin.com/"

