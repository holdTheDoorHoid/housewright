[[facts]]
topic = "scale"
text = "Takagi suggests a softener or anti-scale treatment where water is hard; in very hard water, book a plumber to descale the heat exchanger. A lower temperature setting also slows scale. The FAQ gives no fixed interval."
source = "https://www.takagi.com/support/frequently-asked-questions"

