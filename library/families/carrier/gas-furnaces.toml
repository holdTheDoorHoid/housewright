[[facts]]
topic = "serial"
text = "The furnace serial number is on the rating label inside the front door panel, which you open by turning its knobs counterclockwise and pulling it toward you."
source = "https://www.carrier.com/residential/en/us/homeowner-resources/faqs/"

[[facts]]
topic = "filter"
text = "When a dirty filter chokes the airflow, the furnace can run hot and switch itself off, which shows up as short on-off cycles. Replacing the filter is the first thing to try."
source = "https://www.carrier.com/residential/en/us/products/furnaces/furnace-repair/"

[[facts]]
topic = "safety"
text = "If you smell gas, do not touch switches or appliances; leave the house and call the gas utility or emergency services from outside."
source = "https://www.carrier.com/residential/en/us/products/furnaces/furnace-repair/"

[[facts]]
topic = "safety"
text = "Warning signs of a cracked heat exchanger, which can let carbon monoxide into the house: soot, yellow burner flames, or the CO alarm going off. If the alarm sounds, get everyone out and call emergency services; a qualified technician must check the furnace before it is used again."
source = "https://www.carrier.com/residential/en/us/products/furnaces/furnace-repair/"

[[facts]]
topic = "service"
text = "Carrier ties efficiency and service life to regular maintenance but publishes no fixed interval on this page. Book a technician for the tune-up."
source = "https://www.carrier.com/residential/en/us/products/furnaces/furnace-repair/"

[warranty]
summary = "Registered within 90 days: choose 10 years parts-only, or 5 years parts plus 3 years labor if the installer takes part in the labor program. Not registered in time: 5 years parts only. New-construction installs are not eligible. The page states no maintenance requirement."
length = "10 years parts"
source = "https://www.carrier.com/residential/en/us/homeowner-resources/warranty/"

