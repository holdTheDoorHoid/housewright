[[facts]]
topic = "filter"
text = "Look at the air filter every 2 to 3 months and replace it when dirty; pets, smoke, cooking, allergies and long run times mean sooner."
source = "https://www.carrier.com/residential/en/us/products/air-conditioners/ac-maintenance/"

[[facts]]
topic = "outdoor"
text = "Keep 2 to 3 feet of open space around the condenser, trim plants, and clear leaves from the base. With power off, vacuum the fins with a soft brush or have a pro rinse them; never use a power washer."
source = "https://www.carrier.com/residential/en/us/products/air-conditioners/ac-maintenance/"

[[facts]]
topic = "service"
text = "Plan a yearly technician visit in early spring, before the hot weather; expect it to take one to two hours. Carrier warns that skipping licensed maintenance can void a warranty, so read your certificate. Book a technician."
source = "https://www.carrier.com/residential/en/us/products/air-conditioners/ac-maintenance/"

[[facts]]
topic = "condensate"
text = "A blocked condensate line can be cleared with a wet/dry shop vacuum or a flexible brush; keeping it clear stops water backing up and mold growing."
source = "https://www.carrier.com/residential/en/us/products/air-conditioners/ac-maintenance/"

[warranty]
summary = "Registered within 90 days: choose 10 years parts-only, or 5 years parts plus 3 years labor if the installer joins the labor program. Not registered in time: 5 years parts only. The warranty page itself states no maintenance requirement."
length = "10 years parts"
source = "https://www.carrier.com/residential/en/us/homeowner-resources/warranty/"

