[[facts]]
topic = "jam"
text = "For a jam, turn off the disposer and water, fit the supplied wrench (or a 1/4 inch Allen key) in the hole under the unit and work it back and forth until it spins freely. Lift debris out with tongs, never your hand."
source = "https://www.insinkerator.com/en-us/support/fixing-a-jammed-garbage-disposal"

[[facts]]
topic = "reset"
text = "When the motor overheats, the small red overload button on the bottom drops about 1/4 inch. Press it back gently; if it will not stay in, wait ten minutes and retry, and if the motor still will not run, check the breaker or fuse."
source = "https://www.insinkerator.com/en-us/support/fixing-a-jammed-garbage-disposal"

