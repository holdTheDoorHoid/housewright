[[facts]]
topic = "grease filter"
text = "The stainless baffle filters supplied with the KB-36 come out easily and can go in the dishwasher; ZLINE says its hoods ship with dishwasher-safe baffle or mesh filters depending on model."
source = "https://zlinekitchen.com/products/zline-36-wall-mount-range-hood-stainless-steel-kb-36"

[[facts]]
topic = "charcoal filter"
text = "The KB-36 can run ductless, but only with charcoal filters (model CF1), which are not in the box and must be bought separately."
source = "https://zlinekitchen.com/products/zline-36-wall-mount-range-hood-stainless-steel-kb-36"

