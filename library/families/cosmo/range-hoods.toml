[[facts]]
topic = "grease filter"
text = "Clean monthly if you cook daily, seasonally if not, and after any big holiday meal. Soak 15+ minutes in boiling water with degreasing dish soap and half a cup of baking soda, lift it out while hot, rinse hot and dry fully."
source = "https://cosmoappliances.com/how-to-clean-your-range-hood-and-filters/"

[[facts]]
topic = "filter types"
text = "Stainless baffle filters may go in the dishwasher or be hand-washed; aluminum mesh filters are hand-wash only and should be replaced once badly clogged. Carbon filters cannot be washed and are replaced every 4 to 6 months depending on use."
source = "https://cosmoappliances.com/support-hub/general-range-hood-faq/"

