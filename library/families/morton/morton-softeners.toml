[[facts]]
topic = "salt"
text = "Morton sets no single salt-check interval; it suggests linking refills to a routine, for example two bags whenever you change the furnace air filter (about every 60 to 90 days)."
source = "https://www.mortonsalt.com/resources/maintaining-morton-water-softener/"

[[facts]]
topic = "resin"
text = "To clean the resin, Morton suggests adding two or three bags of its System Saver II or Rust Remover salt, timed to a routine such as a car oil change, or sooner if hard-water signs come back."
source = "https://www.mortonsalt.com/resources/maintaining-morton-water-softener/"

