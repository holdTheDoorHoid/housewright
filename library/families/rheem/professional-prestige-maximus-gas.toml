source = "https://www.rheem.com/product/rheem-professional-prestige-maximus-heavy-duty-with-leaksense-propg75-100u-rh-he-ec3/"

[[facts]]
topic = "installation"
text = "Gas connection is 1/2 inch NPT, water connections are 3/4 inch NPT, and the condensate drain is 3/4 inch with a built-in neutralizer. Rated for installs up to 10,100 ft elevation."
source = "https://www.rheem.com/product/rheem-professional-prestige-maximus-heavy-duty-with-leaksense-propg75-100u-rh-he-ec3/"

[[facts]]
topic = "care"
text = "Two anode rods are fitted and the drain valve is a larger brass type for quicker draining. The page gives no service interval; the Use and Care Manual is the place to look."
source = "https://www.rheem.com/product/rheem-professional-prestige-maximus-heavy-duty-with-leaksense-propg75-100u-rh-he-ec3/"

[[facts]]
topic = "safety"
text = "A temperature and pressure relief valve is already fitted, and the display has a leak sensor plus system health alerts."
source = "https://www.rheem.com/product/rheem-professional-prestige-maximus-heavy-duty-with-leaksense-propg75-100u-rh-he-ec3/"

