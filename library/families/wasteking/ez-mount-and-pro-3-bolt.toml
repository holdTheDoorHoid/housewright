[[facts]]
topic = "jam"
text = "For a jam, cut power at the plug or breaker first, take out the stopper and splashguard, then turn the grinding plate from underneath with a wooden spoon or a jam-clearing wrench until it spins freely."
source = "https://www.wasteking.com/support/faq"

[[facts]]
topic = "reset"
text = "The reset button trips when the motor overheats, often after a jam. Once the plate turns freely, press the button until it clicks and stays in."
source = "https://www.wasteking.com/support/faq"

[[facts]]
topic = "care"
text = "Keep out large bones, shells, corn husks, glass, plastic, metal, hot grease and caustic drain cleaner."
source = "https://www.wasteking.com/support/faq"

[[facts]]
topic = "warranty"
text = "Warranty length depends on the model; look up your model's warranty sheet under downloads, and hold on to the receipt to prove the purchase date."
source = "https://www.wasteking.com/support/faq"

