[[facts]]
topic = "cleaning"
text = "Pull the plug and let the oven cool before cleaning. Light soiling comes off with a soft damp cloth; use only mild, non-abrasive detergent, and avoid spray cleaners and anything containing ammonia or alcohol."
source = "https://help.na.panasonic.com/answers/how-to-care-and-clean-the-microwave-oven/"

[[facts]]
topic = "turntable"
text = "Wash the glass tray with a sponge and dish detergent, never a metal brush. Stop using a tray that is cracked, chipped or scratched."
source = "https://help.na.panasonic.com/answers/how-to-care-and-clean-the-microwave-oven/"

[warranty]
summary = "The NN-SN755S and NN-SN96JS pages list 1 year parts and labor, plus 4 more years on the magnetron tube, parts only."
