[[facts]]
topic = "care"
text = "A blank traditional thermostat is most often dead batteries. If new batteries do not help, switch its breaker off for 20 to 30 seconds with the HVAC idle, then back on."
source = "https://www.trane.com/residential/en/resources/troubleshooting/thermostat-controls/"

[[facts]]
topic = "wifi"
text = "A smart thermostat that drops Wi-Fi normally reconnects alone. If not, switch Wireless off and on under Menu, Settings, Network."
source = "https://www.trane.com/residential/en/resources/troubleshooting/thermostat-controls/"

[[facts]]
topic = "care"
text = "On XL824, XL850 and XL1050 models the shown temperature can be corrected under Indoor Calibrations; compare it with a trusted thermometer first."
source = "https://www.trane.com/residential/en/resources/troubleshooting/thermostat-controls/"

