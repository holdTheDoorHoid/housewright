text = "Trane publishes one owner's manual for all air conditioners, heat pumps and air handlers and another for gas heating systems, so no model number is needed to find them."
source = "https://www.trane.com/residential/en/resources/owners-guides/"

[[facts]]
topic = "filter"
text = "Trane advises changing furnace or air-handler filters year-round: every 30 to 90 days with no pets, sooner with pets or allergies. A thicker filter can last longer than a 1 inch one."
source = "https://www.trane.com/residential/en/resources/maintenance-tips/gas-furnaces/"

[warranty]
summary = "Registered within 60 days of installation: usually 10 years on parts. Otherwise usually 5 years. Terms vary by product. Labor is not included; a dealer-sold extended plan may add it. No maintenance condition is stated."
length = "10 years parts"
source = "https://www.trane.com/residential/en/resources/warranty-and-registration/"

