[[facts]]
topic = "charcoal filter"
text = "The charcoal filter behind the top vent grille cannot be washed. Whirlpool suggests a new one roughly every 6 months, or whenever the filter indicator asks for it."
source = "https://producthelp.whirlpool.com/Cooking/Microwaves/Over-the-Range_Microwave/Cleaning_and_Filters/Exterior/Cleaning_the_Filters_(Grease_and_Charcoal)_-_Over-the-Range_Microwave"

[[facts]]
topic = "grease filter"
text = "Wash the grease filter once a month, or when the filter indicator comes on, using mild soap and water. Most can also go in the dishwasher, but confirm that in your owner manual first."
source = "https://producthelp.whirlpool.com/Cooking/Microwaves/Over-the-Range_Microwave/Cleaning_and_Filters/Exterior/Cleaning_the_Filters_(Grease_and_Charcoal)_-_Over-the-Range_Microwave"

