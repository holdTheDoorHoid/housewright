[[facts]]
topic = "filter"
text = "A whole-home (point-of-entry) filter goes on the main supply where it enters the house and stops grit and rust before it reaches pipes and appliances. Finer micron ratings catch smaller particles but plug up sooner in sediment-heavy water."
source = "https://whirlpoolwatersolutions.com/owner-center/contaminants-filtration-systems-faq/"

[[facts]]
topic = "filter"
text = "Whirlpool's filtration FAQ gives 6 months as the usual change interval for its filter systems in general, adjusted to your water; it does not single out whole-home units. It also says its Premium Carbon whole-home filters (FACT media) last twice as long as its other whole-home filters."
source = "https://whirlpoolwatersolutions.com/owner-center/contaminants-filtration-systems-faq/"
note = "The 6-month figure is general guidance, not a whole-home-specific rating; follow the cartridge label."

