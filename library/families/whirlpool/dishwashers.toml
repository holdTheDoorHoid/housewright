[[facts]]
topic = "filter"
text = "Clean the filters about once a month, or every 2 weeks in a big household or with daily runs. Rinse both parts under running water, use only a soft brush, and never run the machine without them."
source = "https://producthelp.whirlpool.com/Dishwashers/Product_Info/Dishwasher_Cleaning_and_Care/How_to_Clean_the_Dishwasher_Filters"

[[facts]]
topic = "filter"
text = "After refitting, the upper filter assembly should lock with a quarter turn. If it spins freely it is not locked in."
source = "https://producthelp.whirlpool.com/Dishwashers/Product_Info/Dishwasher_Cleaning_and_Care/How_to_Clean_the_Dishwasher_Filters"

