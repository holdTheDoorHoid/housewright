[[facts]]
topic = "cleaning"
text = "Run the washer cleaning routine about once a month or every 30 loads, whichever comes first. Use an empty tub and keep it uninterrupted; add no detergent."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

[[facts]]
topic = "cleaning"
text = "For the Clean Washer cycle, drop one affresh Washer Cleaner tablet at the bottom of the basket, not into the dispenser. If the cycle is interrupted, finish with a Rinse and Spin."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

[[facts]]
topic = "cleaning"
text = "Instead of the tablet you can pour 1 cup of ordinary liquid chlorine bleach in the dispenser; more than that can harm the washer over time, and thickened or no-splash bleach causes too many suds."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

[[facts]]
topic = "care"
text = "Leave the lid or door open after cleaning and between loads so the inside dries and odor-causing residue does not build up."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

