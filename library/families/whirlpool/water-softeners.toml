[[facts]]
topic = "salt"
text = "Use high-purity evaporated salt pellets to cut down on tank sludge and salt bridges; potassium chloride works instead for anyone limiting sodium."
source = "https://whirlpoolwatersolutions.com/owner-center/hard-water-water-softening-systems-faq/"

[[facts]]
topic = "regeneration"
text = "A typical home regenerates every 3 to 7 days, only when the resin needs it. A cycle takes about 2 hours and is preset for 2 a.m."
source = "https://whirlpoolwatersolutions.com/owner-center/hard-water-water-softening-systems-faq/"

[[facts]]
topic = "capacity"
text = "WHEC46: 46,000 grain capacity, holds up to 200 lb of salt, rated for hardness up to 160 gpg and up to 12 ppm clear-water iron."
source = "https://whirlpoolwatersolutions.com/products/wifi-water-softener-for-on-demand-control/"

