[[facts]]
topic = "cleaning"
text = "Whirlpool wants the cleaning routine run at least monthly or every 30 loads, whichever is sooner, on an empty tub with no detergent and without stopping it partway."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

[[facts]]
topic = "cleaning"
text = "Put one affresh Washer Cleaner tablet in the bottom of the basket (not the dispenser) for the Clean Washer cycle; if the cycle gets cut short, run Rinse and Spin to flush the cleaner out."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

[[facts]]
topic = "cleaning"
text = "Liquid chlorine bleach, 1 cup (236 mL) in the dispenser, can stand in for the tablet. Larger doses can damage the washer over time, and thick, easy-pour or no-splash bleach makes excess suds."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

[[facts]]
topic = "care"
text = "Leave the lid or door open after cleaning and between loads so the inside dries and odor-causing residue does not build up."
source = "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Cleaning_and_Care/Removing_Odors_from_the_Interior_of_a_Washer"

