[[facts]]
topic = "grease filter"
text = "Clean metal grease filters about every six months with normal cooking, sooner as needed. Soak in hot water with detergent, brush lightly, dry fully. Avoid ammonia products. Dishwasher is allowed but may discolor them."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=16685"

