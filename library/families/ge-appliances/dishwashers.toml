[[facts]]
topic = "filter"
text = "Clean the fine and ultra-fine filters about every other month, sooner with heavy use or gritty dishes. Rinse in warm soapy water, no scouring pads. Self-cleaning filtration models have no removable filter."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=35611"

