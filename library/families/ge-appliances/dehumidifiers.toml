[[facts]]
topic = "filter"
text = "On newer GE models a Clean the Filter light comes on after 250 hours of running. Clean the filter, then clear the reminder by holding the Filter button for 3 seconds. The filter must not go in a dishwasher."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=16794"

[[facts]]
topic = "filter"
text = "To clean it, vacuum the filter; if it is very dirty, wash it with warm (not hot) water and a little dish soap. It must be completely dry before it goes back in. On older models GE suggests looking at it every 2 to 3 weeks."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=34658"

