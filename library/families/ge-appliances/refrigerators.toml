[[facts]]
topic = "filter"
text = "GE says to swap the fridge water filter about every 6 months, or after roughly 170 to 200 gallons depending on model, and sooner if flow to the dispenser or ice maker slows. Follow the indicator light if your model has one."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=21284"

[[facts]]
topic = "filter"
text = "Filter types are not interchangeable: MWF-style SmartWater, XWFE, RPWFE, cylindrical GSWF and MSWF all exist. Check the old cartridge label or the manual. Without a filter or the bypass plug the dispenser and ice maker will not run."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=16933"

