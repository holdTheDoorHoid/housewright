[[facts]]
topic = "vent"
text = "GE calls for a 4 inch solid metal or aluminum vent, not plastic, no longer than your model installation instructions allow. Keep the inside free of buildup and make sure the outside wall cap opens all the way."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=17442"

[[facts]]
topic = "lint"
text = "Fabric softener residue can clog the fine mesh of the lint screen; wash the screen in soapy water and let it dry completely before refitting it."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=17442"

[[facts]]
topic = "safety"
text = "GE says to disconnect the dryer from power before you clean or maintain it."
source = "https://products.geappliances.com/appliance/gea-support-search-content?contentId=17442"

