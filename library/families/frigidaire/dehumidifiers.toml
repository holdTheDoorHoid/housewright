[[facts]]
topic = "storage"
text = "To put the unit away, unplug it, take off any drain hoses, empty and wash the bucket, let everything dry for a day or two, then cover it or box it. When you bring it back out, wash the filter and flush the drain hoses first."
source = "https://owner.frigidaire.com/support-articles/article/1927766-dehumidifier-clean-and-care"

[[facts]]
topic = "bucket"
text = "Wash the bucket with mild soap and water, taking off the handle and splash guard as the owner manual shows; pan treatment tablets help keep odor and algae down."
source = "https://owner.frigidaire.com/support-articles/article/1927766-dehumidifier-clean-and-care"

[[facts]]
topic = "troubleshooting"
text = "H3 or E5 means the compressor overload protection tripped: give the unit proper clearance, clean the filter if dirty, run it only between 41 F and 89 F, and unplug it to cool. PU means the pump could not empty the bucket in time; check the drain hose for kinks, clogs or ice."
source = "https://owner.frigidaire.com/support-articles/article/1838728-dehumidifiers-error-code-guide"

