[[facts]]
topic = "charcoal filter"
text = "The charcoal filter, where fitted, sits behind the vent grille. With power off at the plug or breaker, take out the grille screws and grille, then push the filter in, twist it and pull it free; refit so the grille's top and bottom tabs engage."
source = "https://owner.frigidaire.com/support-articles/article/1847534-microwaves-how-do-i-change-the-oven-light-on-my-over-the-range-microwave-"

[[facts]]
topic = "light"
text = "The oven light is reached by lifting its cover once the vent grille and charcoal filter are out; replace the bulb with an equivalent 30-watt one."
source = "https://owner.frigidaire.com/support-articles/article/1847534-microwaves-how-do-i-change-the-oven-light-on-my-over-the-range-microwave-"

