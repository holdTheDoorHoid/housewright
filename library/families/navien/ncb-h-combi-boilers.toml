[[facts]]
topic = "design"
text = "Space heating passes through a pair of stainless heat exchangers, while tap hot water has its own plate exchanger. The boiler board itself can drive as many as three heating zones, using pumps or zone valves."
source = "https://www.navieninc.com/series/ncb-h"

[[facts]]
topic = "sizes"
text = "Five models with maximum heating input from 60,000 to 150,000 BTU/h and maximum hot-water input from 160,000 to 210,000 BTU/h. Rated for use up to 10,100 feet on natural gas or propane."
source = "https://www.navieninc.com/series/ncb-h"

[[facts]]
topic = "safety"
text = "Navien publishes separate guides for converting between natural gas and propane and for high-altitude setup. These change gas settings: book a licensed installer rather than converting it yourself."
source = "https://www.navieninc.com/series/ncb-h/downloads"

