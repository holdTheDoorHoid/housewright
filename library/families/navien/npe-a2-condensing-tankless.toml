[[facts]]
topic = "venting"
text = "With 2 inch vent the longest run is 75 feet and 6 elbows, each 90 degree elbow counting as 8 feet. With 3 inch vent it is 150 feet and 8 elbows, each counting 5 feet."
source = "https://www.navieninc.com/series/npe-a2/npe-a2-series-faqs"

[[facts]]
topic = "clearance"
text = "Schedule 40 PVC vent pipe may sit with zero clearance to combustible material, according to the FAQ."
source = "https://www.navieninc.com/series/npe-a2/npe-a2-series-faqs"

[[facts]]
topic = "installation"
text = "Gas line of 1/2 inch is allowed up to 24 feet and the series can be cascaded up to 32 units."
source = "https://www.navieninc.com/series/npe-a2"

[warranty]
summary = "Residential NPE-A2 Advanced: labor 1 year, parts 5 years, heat exchanger 15 years (standard or controlled recirculation); with uncontrolled recirculation parts 3 and heat exchanger 5 years. Void for online or unauthorised purchase; hard water damage excluded."
length = "15 years heat exchanger"
source = "https://www.navieninc.com/series/npe-a2/warranty"

