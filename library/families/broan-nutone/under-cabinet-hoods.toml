[[facts]]
topic = "grease filter"
text = "Broan-NuTone puts most hood filters on a 1 to 3 month cleaning cycle, shorter if you cook daily, use lots of oil or cook at high heat. Wash with warm water, a mild degreaser and a soft brush or sponge, and let them dry fully before they go back."
source = "https://broan-nutone.com/en-us/home/customer-service/range-hood-faqs"

[[facts]]
topic = "charcoal filter"
text = "Charcoal filters in ductless hoods are generally not washable; they are replaced, on a schedule that depends on how much you cook."
source = "https://broan-nutone.com/en-us/home/customer-service/range-hood-faqs"

[[facts]]
topic = "filter"
text = "The MTR1303SS ships with two micromesh filters that can go in the dishwasher. Running it ductless needs a filter kit bought separately."
source = "https://broan-nutone.com/en-us/product/rangehoods/mtr1303ss"

