[[facts]]
topic = "filter"
text = "LG says to change the fridge water filter about every 6 months, or sooner if flow is slow or the replace-filter light comes on. After the swap, hold the filter button for 3 seconds until a chime sounds or the light goes out."
source = "https://www.lg.com/us/support/help-library/lg-refrigerator-how-to-replace-the-water-filter-CT10000021-20155582266968"

[[facts]]
topic = "filter"
text = "The water filter is a different part from the air filter. LG lists LT500P, LT600P, LT700P, LT800P and LT1000P internal filters plus the external FFS-002, so match the old cartridge or your manual."
source = "https://www.lg.com/us/support/help-library/lg-refrigerator-how-to-replace-the-water-filter-CT10000021-20155582266968"

