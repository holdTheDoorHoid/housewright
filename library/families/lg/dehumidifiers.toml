[[facts]]
topic = "filter"
text = "A Check Filter light comes on after 350 hours of running (about 15 days nonstop). Inspect and wash the filter as needed, then hold Filter Reset for 3 seconds to set the hour count back to zero."
source = "https://www.lg.com/us/support/help-library/lg-dehumidifier-general-usage--20150768174494"

[[facts]]
topic = "operation"
text = "Run it only in rooms between 41 F and 90 F; colder and water can freeze inside, hotter and it can overheat. After 23 hours of nonstop running it rests for an hour on its own, which is normal."
source = "https://www.lg.com/us/support/help-library/lg-dehumidifier-general-usage--20150768174494"

