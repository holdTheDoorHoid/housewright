[[facts]]
topic = "grease filter"
text = "Take the grease filters out and wash them at least once a month. They do not go in the dishwasher: unplug the oven, soak them in hot water with a mild detergent, and skip ammonia or lye-based oven cleaners."
source = "https://www.lg.com/ca_en/support/product-support/troubleshoot/help-library/cs-CT52001644-1424373987212/"

[[facts]]
topic = "charcoal filter"
text = "The charcoal filter sits behind the vent grille on many models. It cannot be washed; LG says to swap it for a new one every 6 to 12 months, sooner with heavy cooking."
source = "https://www.lg.com/ca_en/care-accessories/microwave-ovens/others/5230w1a003a/"

