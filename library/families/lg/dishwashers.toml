[[facts]]
topic = "filter"
text = "LG says to clean the filters at least monthly, more in hard-water areas. Lift out the inner and steel filters together, separate them, rinse with a soft cloth or non-abrasive brush, then lock the inner filter back."
source = "https://www.lg.com/us/support/video-tutorials/cleaning-the-filter-dishwasher-CT10000009-20150210129262"

