[[facts]]
topic = "filter"
text = "LG suggests cleaning the filter about every two weeks, more or less often depending on how hard the unit works. Wash it in lukewarm water below 104 F (40 C) and let it dry fully before refitting, since a damp filter can lead to smells or mould."
source = "https://www.lg.com/us/support/help-library/lg-ac-filter-windowpotable-how-do-i-clean-and-replace-the-filter--20155017810371"

[[facts]]
topic = "filter"
text = "On room units with a filter light, the light comes on after 250 hours of running. After cleaning, press Temp up and Temp down together on the unit's own control panel to clear it; the remote cannot reset it."
source = "https://www.lg.com/ca_en/support/product-support/troubleshoot/help-library/cs-CT32013622-20152779781882/"
note = "From LG Canada's room air conditioner article; check the manual for your model."

