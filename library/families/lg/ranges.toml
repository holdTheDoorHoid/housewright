[[facts]]
topic = "anti-tip"
text = "The bracket ships with a template. Its screws must reach framing or a wood sill plate, or the floor on metal-stud walls. Check by carefully tilting the range forward by hand, and re-check whenever it has been pulled out from the wall."
source = "https://www.lg.com/us/support/products/documents/MFL68920504_EN_ES_1_161005.pdf"
unverified = true
note = "Only in the PDF manual, which reviewers may not open; wording came from search snippets of LG range manuals. No LG HTML page with this was found."

[[facts]]
topic = "gas smell"
text = "If you smell gas or hear it leaking, CPSC says to get out of the home at once without touching lights, phones or any other electronics on the way, then call the gas utility or local gas authority from outside."
source = "https://www.cpsc.gov/Newsroom/News-Releases/2026/CPSC-Issues-Winter-Weather-Safety-Tips-to-Prevent-Fires-and-Carbon-Monoxide-Poisoning"
note = "General CPSC advice from its 2026-03-16 release; LG's own wording is only in PDF manuals, which were not opened."

