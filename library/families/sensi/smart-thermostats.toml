[[facts]]
topic = "power"
text = "The Touch 2 will not run without a common wire, so check for a spare wire behind the old thermostat before buying."
source = "https://sensi.copeland.com/en-us/support/installation/installing-sensi-touch2-smart-thermostat"

[[facts]]
topic = "wifi"
text = "Sensi connects only to 2.4 GHz Wi-Fi, so a 5 GHz-only network will not work."
source = "https://sensi.copeland.com/en-us/support/installation/installing-sensi-touch2-smart-thermostat"

[[facts]]
topic = "safety"
text = "Switch off the heating and cooling system first. Take a photo of the old wiring and tag the wires one at a time as you free them. Most buyers in a Sensi survey finished in 30 minutes or less; adding a common wire takes longer."
source = "https://sensi.copeland.com/en-us/support/installation/installing-sensi-touch2-smart-thermostat"

[warranty]
summary = "Three years on most models; five years on the professional series when a contractor both buys and installs it. The length depends on model type and who installed it."
length = "3 years"
source = "https://sensi.copeland.com/en-us/legal/sensi-warranty"

