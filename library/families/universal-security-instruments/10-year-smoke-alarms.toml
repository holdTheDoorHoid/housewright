[[facts]]
topic = "end of life"
text = "On USI alarms, a repeating double chirp once a minute usually marks end of life at around 10 years; changing the battery will not stop it, so replace the alarm."
source = "https://www.universalsecurity.com/blogs/safety-measures/why-is-my-smoke-detector-beeping"

[[facts]]
topic = "low battery"
text = "A lone chirp every 30 to 60 seconds is a low-battery warning on models with a replaceable battery; fit a fresh alkaline 9V or whatever type the label on the back names. The sealed 10-year models instead give one end-of-life alert."
source = "https://www.universalsecurity.com/blogs/safety-measures/why-is-my-smoke-detector-beeping"

[[facts]]
topic = "replacement"
text = "Replace each smoke alarm 10 years after the manufacture date on the back, and sooner if it has been flooded, exposed to strong heat from a fire, cracked, or keeps chirping after a battery change while under 10 years old."
source = "https://www.universalsecurity.com/blogs/safety-measures/why-is-my-smoke-detector-beeping"

[[facts]]
topic = "testing"
text = "Press the test button on every smoke alarm once a month. Alarms with replaceable batteries need new ones yearly; the 10-year models' test/silence button also hushes a false alarm."
source = "https://www.universalsecurity.com/blogs/safety-measures/why-is-my-smoke-detector-beeping"

