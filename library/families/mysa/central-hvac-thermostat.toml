[[facts]]
topic = "power"
text = "Runs on 24 volts AC and needs a common wire. For two-wire heat-only or cool-only systems Mysa sells a separate C-wire power adapter."
source = "https://getmysa.com/pages/thermostats/mysa-thermostat"

[[facts]]
topic = "wiring"
text = "If the system has separate RH and RC wires, flip the switch on the back of the display to the non-default side; leave it alone for a single transformer."
source = "https://getmysa.com/pages/thermostats/mysa-thermostat"

[[facts]]
topic = "limits"
text = "No accessory terminal, so it cannot run a humidifier. Wi-Fi must be 2.4 GHz. It handles up to 3 heat stages and 2 cool stages."
source = "https://getmysa.com/pages/thermostats/mysa-thermostat"

