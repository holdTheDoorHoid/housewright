[[facts]]
topic = "safety"
text = "Each month, lay a board about 1.5 inches high (a 2x4 flat) on the floor in the door path and close the door with the opener; it must reverse on touching it. Also block the photo-eye beam while it closes and confirm it stops and reverses."
source = "https://support.chamberlaingroup.com/s/article/Does-my-garage-door-opener-require-any-monthly-or-annual-maintenance-1484145520006"

[[facts]]
topic = "care"
text = "Once a year, lubricate rollers, bearings and hinges with garage door lubricant, but not the tracks. Every two to three years, if your opener needs it, put white lithium grease on the opener rail where the trolley slides, with power disconnected."
source = "https://support.chamberlaingroup.com/s/article/Does-my-garage-door-opener-require-any-monthly-or-annual-maintenance-1484145520006"

[[facts]]
topic = "battery"
text = "If the opener has a battery backup, test it once a year as its owner manual describes."
source = "https://support.chamberlaingroup.com/s/article/Does-my-garage-door-opener-require-any-monthly-or-annual-maintenance-1484145520006"

[[facts]]
topic = "safety"
text = "If the door sticks, binds, runs unevenly or fails either safety test, stop using it and call a garage door professional. Never loosen or adjust the springs, cables, pulleys or brackets yourself: they are under extreme tension."
source = "https://support.chamberlaingroup.com/s/article/Does-my-garage-door-opener-require-any-monthly-or-annual-maintenance-1484145520006"

