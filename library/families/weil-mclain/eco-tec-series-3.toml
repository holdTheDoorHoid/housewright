[[facts]]
topic = "sizes"
text = "Heat-only sizes are 80, 110, 150 and 199 MBH; combi sizes are 110, 150 and 199 MBH. The combi version supplies hot tap water up to 5.4 GPM."
source = "https://www.weil-mclain.com/products/eco-tec-boiler-3/"

[[facts]]
topic = "design"
text = "Stainless steel firetube heat exchanger, built-in ECM circulator and a colour touchscreen control. A maintenance kit flyer is listed among its downloads."
source = "https://www.weil-mclain.com/products/eco-tec-boiler-3/"

[[facts]]
topic = "safety"
text = "Weil-McLain does not service boilers itself; it expects a local heating professional to fit, look after and repair them and recommends one for any parts or maintenance work. Book a technician for the yearly service."
source = "https://www.weil-mclain.com/faq/"

[warranty]
summary = "Registering the boiler within 90 days of installation adds a 5-year extended warranty on service parts; residential installs only."
