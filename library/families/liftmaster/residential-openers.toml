[[facts]]
topic = "safety"
text = "Each month and after any adjustment, lay a board about 1.5 inches high (a 2x4 flat) under the middle of the open door and close it with the opener; it must reverse on hitting it. If it just stops, increase the down travel per the manual. If it still fails, call a trained door technician."
source = "https://support.partner.liftmaster.com/s/article/How-do-I-test-the-Safety-Reversal-System-1484145519301"
unverified = true
note = "source blocked automated fetch at review (TLS certificate error); matches the same article on the sister Chamberlain support site, which was read"

[[facts]]
topic = "battery"
text = "In a power cut the backup battery can keep the opener working for up to about 24 hours."
source = "https://www.liftmaster.com/builder-knowledge-center/offer-battery-backup"

[[facts]]
topic = "battery"
text = "A backup battery usually lasts one to two years, depending on use. The opener's battery status light tells you when it is due for replacement."
source = "https://www.liftmaster.com/battery-backup-garage-door-opener"

