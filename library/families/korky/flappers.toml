[[facts]]
topic = "size"
text = "Flappers come in 2-inch and 3-inch sizes. Look at the drain opening at the bottom of the tank: roughly orange-sized means 2-inch, roughly grapefruit-sized means 3-inch. Korky says most toilets built before 2000 take the 2-inch size."
source = "https://www.korky.com/toilet-repair-help/what-size-flapper-do-i-need"

