[[facts]]
topic = "battery"
text = "X-Sense rates the XS01-WR at about five years on its replaceable 3V CR123A lithium cell and the Wi-Fi XS01-WX at about one year. Sealed-battery alarms are swapped whole once they warn of low battery or end of life."
source = "https://www.x-sense.com/blogs/tips/smoke-detector-battery-guide"

[[facts]]
topic = "replacement"
text = "Swap in a new alarm at its end-of-life signal or ten years from the manufacture date (usually on the back), whichever is first, or sooner if it still fails a test after troubleshooting."
source = "https://www.x-sense.com/blogs/tips/smoke-detector-battery-guide"

[[facts]]
topic = "testing"
text = "Test the alarms monthly, or more often if the model's manual asks. Do not pull the battery to quiet a possible fire alarm; get out and call emergency services from a safe place."
source = "https://www.x-sense.com/blogs/tips/smoke-detector-battery-guide"

