[[facts]]
topic = "replacement"
text = "First Alert tells owners to replace a smoke alarm no later than 10 years after the manufacture date printed on its back."
source = "https://www.firstalert.com/blogs/safety-corner/what-does-the-smoke-alarm-beeps-mean"

[[facts]]
topic = "battery"
text = "The sealed-battery models never need a battery swap, but they still need regular testing. Alarms on ordinary or backup batteries should get fresh ones at least every 6 months."
source = "https://www.firstalert.com/blogs/safety-corner/what-does-the-smoke-alarm-beeps-mean"

[[facts]]
topic = "end of life"
text = "The SM210 gives an end-of-life warning when the alarm is due for replacement; since the battery is sealed, that warning means a new alarm, not a new battery."
source = "https://www.firstalert.com/products/10-year-battery-smoke-alarm-with-slim-profile-design"

[[facts]]
topic = "alarm sound"
text = "A pattern of three beeps and a pause means smoke: get everyone outside, then call 911. Chirps mean a battery or the alarm itself needs replacing; the exact chirp codes differ by model, so check its manual."
source = "https://www.firstalert.com/blogs/safety-corner/what-does-the-smoke-alarm-beeps-mean"

