[[facts]]
topic = "replacement"
text = "The maker's beeps article says alarms should be replaced within 10 years of the date printed on the back; it is written about smoke alarms, so check the CO lifespan in your model's manual."
source = "https://www.firstalert.com/blogs/safety-corner/what-does-the-smoke-alarm-beeps-mean"
unverified = true
note = "Blog is about smoke alarms; CO lifespan per model not confirmed. Manuals on support.firstalert.com were not opened."

[[facts]]
topic = "battery"
text = "The CO710 tabletop alarm runs on a built-in lithium battery sealed for the life of the alarm, so it needs no battery changes and gives no low-battery chirps."
source = "https://www.firstalert.com/products/carbon-monoxide-alarm-with-10-year-battery-and-digital-temperature-display"

