[[facts]]
topic = "safety"
text = "Genie's monthly contact-reverse test: put a 2x4 flat, wide side down, at the middle of the doorway and close the door. It should hit the board and reverse to fully open within two seconds. If not, the close force must be lowered as the owner manual describes; if it still fails, call a Genie dealer."
source = "https://support.geniecompany.com/app/answers/detail/a_id/1221/~/maintenance-and-safety-tips"

[[facts]]
topic = "safety"
text = "To test the Safe-T-Beam sensors, block the beam before pressing the button (the door must not start down), then roll a ball through the beam while the door is closing (it must stop and reverse). If either check fails, Genie says the sensor system may need replacing by a dealer."
source = "https://support.geniecompany.com/app/answers/detail/a_id/1221/~/maintenance-and-safety-tips"

[[facts]]
topic = "springs"
text = "Do not touch, adjust or remove the high-tension springs or the parts they fasten to, and do not run a door that is jammed or has a broken spring; Genie leaves spring work to its professional dealers."
source = "https://support.geniecompany.com/app/answers/detail/a_id/1221/~/maintenance-and-safety-tips"

