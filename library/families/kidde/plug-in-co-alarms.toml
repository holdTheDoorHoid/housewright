[[facts]]
topic = "replacement"
text = "Kidde CO alarms have a 7 or 10 year service life depending on model; once one signals end of life, fitting new batteries will not stop the chirp and the alarm must be replaced."
source = "https://www.kidde.com/support/carbon-monoxide-alarms/replacement-faqs"

[[facts]]
topic = "battery"
text = "For the COP's backup, Kidde approves only alkaline AA cells (Energizer E91, Gold Peak 15A or Golden Power GLR6A) and says not to fit lithium batteries."
source = "https://www.kidde.com/products/carbon-monoxide-alarms/carbon-monoxide-alarm-plug-in-with-aa-backup-battery-cop"

