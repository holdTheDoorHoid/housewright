[[facts]]
topic = "battery"
text = "The 20SAR runs on two AA backup batteries; Kidde says to swap them every 6 months or as soon as the low-battery chirp starts, and to unplug the alarm's wiring before changing them."
source = "https://www.kidde.com/products/smoke-alarms/smoke-alarm-hardwired-with-aa-backup-battery"

[[facts]]
topic = "models"
text = "Kidde lists hardwired versions with a 9V backup (20SAR9V), AA backup (20SAR), a 10-year backup battery (20SA10, 20SA10-V) and a sealed 10-year backup with strobe (50SA10-S)."
source = "https://www.kidde.com/products/smoke-alarms"

[warranty]
