[[recalls]]
title = "Kidde PI2010 (hardwired) and PI9010 (battery) dual-sensor smoke alarms dated 2016 Sep 10 to 2017 Oct 13: a yellow cap left on may block a sensor; free replacement"
date = 2018-03-21
url = "https://www.cpsc.gov/Recalls/2018/Kidde-Recalls-Dual-Sensor-Smoke-Alarms-Due-to-Risk-of-Failure-to-Alert-Consumers-to-a-Fire"
note = "The PI2010 is the AC hardwired model that belongs here; the PI9010 is DC battery powered and has no Kidde family of its own yet, so the recall is kept on this family for both. Details confirmed in the CPSC recall database (recall 18128); the cpsc.gov page itself blocked automated fetch."

