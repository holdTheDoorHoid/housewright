[[facts]]
topic = "replacement"
text = "A decade after it is first switched on, the 20SD10 starts a reminder beep; at that point the whole alarm is swapped for a new one, since the battery cannot be changed."
source = "https://www.kidde.com/products/smoke-alarms/smoke-alarm-10-year-battery-powered"

[[facts]]
topic = "battery"
text = "Its built-in battery runs the alarm for 10 years with no changes, and Kidde advertises it as free of low-battery chirps."
source = "https://www.kidde.com/products/smoke-alarms/smoke-alarm-10-year-battery-powered"

[[facts]]
topic = "testing"
text = "Kidde says internal components keep the alarm working as expected, but the product page gives no test schedule; test it with the button as the user guide directs."
source = "https://www.kidde.com/products/smoke-alarms/smoke-alarm-10-year-battery-powered"

