[[facts]]
topic = "replacement"
text = "Kidde gives a 7 or 10 year service life for its CO alarms depending on the model; the user guide for your model says which applies."
source = "https://www.kidde.com/support/carbon-monoxide-alarms/replacement-faqs"

[[facts]]
topic = "end of life"
text = "A non-digital Kidde CO alarm that has reached end of life gives a short beep twice a minute while its red light flashes. New batteries will not silence it; replace the alarm."
source = "https://www.kidde.com/support/carbon-monoxide-alarms/replacement-faqs"

[[facts]]
topic = "battery"
text = "The COB runs on AA batteries that Kidde says normally need replacing once a year."
source = "https://www.kidde.com/products/carbon-monoxide-alarms/carbon-monoxide-alarm-aa-battery-powered-cob"

[[facts]]
topic = "battery"
text = "The COB10 has a 10-year battery that is never replaced, so there are no battery changes or low-battery chirps; heat, cold or high humidity can shorten that battery life."
source = "https://www.kidde.com/products/carbon-monoxide-alarms/carbon-monoxide-alarm-10-year-battery-powered-cob10"

[[facts]]
topic = "hush"
text = "The COB10 has a single button for testing and for silencing false alarms."
source = "https://www.kidde.com/products/carbon-monoxide-alarms/carbon-monoxide-alarm-10-year-battery-powered-cob10"

[warranty]
summary = "Ten-year limited warranty on the COB10, battery included."
length = "10 years"
source = "https://www.kidde.com/products/carbon-monoxide-alarms/carbon-monoxide-alarm-10-year-battery-powered-cob10"

