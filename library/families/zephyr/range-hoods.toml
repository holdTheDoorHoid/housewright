[[facts]]
topic = "grease filter"
text = "Metal baffle filters never need replacing but should be cleaned about every 30 days, more with heavy cooking. Wash by hand in hot soapy water or on a low-heat dishwasher cycle."
source = "https://docs.zephyronline.com/docs/manuals/sienab_manual.pdf"
unverified = true
note = "Only in PDF manuals, which reviewers may not open, and the Zephyr help center returned 403; wording came from search snippets. Check your model manual."

[[facts]]
topic = "charcoal filter"
text = "Charcoal filters for recirculating use must not be washed. Many Zephyr hoods remind you to change them after about 120 hours of fan use; the exact figure varies by model."
source = "https://docs.zephyronline.com/docs/manuals/napolid_manual.pdf"
unverified = true
note = "Only in PDF manuals, which reviewers may not open; wording came from search snippets. Unconfirmed details (Napoli 200 hours, reminder off by default) were removed at review."

