# Generic template ids and keys from the Housewright app
# (holdTheDoorHoid/housewright, templates/ at commit 01d8b19).
# Only ids, keys and each task's schedule summary are mirrored here, so
# `extends`, task overrides and redundant overrides can be checked without the
# app. Update this file when the app's templates change.
format = 1
app_commit = "01d8b19"

[[template]]
id = "attic"
category = "structure"
tasks = ["inspect", "after_storm"]
fields = []
schedules = { inspect = "seasonal autumn", after_storm = "seasonal spring" }

