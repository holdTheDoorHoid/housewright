[package]
name = "housewright-sync"
description = "Housewright sync client: push, pull, pairing and recovery over an encrypted relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
housewright-core.workspace = true
housewright-crypto = { path = "../crypto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
default = []
# A blocking HTTP client for native platforms (Android, desktop, tests).
# The web build brings its own transport (synchronous XHR in the worker).
native-http = ["dep:ureq"]

[dev-dependencies]
housewright-plan.workspace = true
housewright-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false }
http-body-util = "0.1"
rusqlite.workspace = true
proptest.workspace = true
uuid.workspace = true
jiff.workspace = true
