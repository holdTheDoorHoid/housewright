[package]
name = "housewright-api"
description = "One command surface over the Housewright core, shared by the Tauri app and the WebAssembly build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
housewright-core.workspace = true
housewright-plan.workspace = true
housewright-media.workspace = true
housewright-binder.workspace = true
housewright-sync.workspace = true
housewright-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true

[build-dependencies]
# Packs the vendored appliance library (library/) into one compressed
# bundle compiled into the app (D-147).
flate2.workspace = true
serde_json.workspace = true

[features]
default = ["typeset"]
# Typeset the binder in this process (Android, desktop, tests). The web
# build leaves it out and typesets in `web-binder/` (D-80).
typeset = ["housewright-binder/typeset"]

[dev-dependencies]
image.workspace = true
housewright-sync = { workspace = true, features = ["native-http"] }
housewright-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid.workspace = true
