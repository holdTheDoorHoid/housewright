[package]
name = "housewright-app"
description = "Housewright on Android and desktop: Tauri 2 shell over the core"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.92"
publish = false

# Built only by `cargo tauri android ...` (and desktop where WebKitGTK is
# installed); it is outside the main workspace so `cargo test --workspace`
# does not need Tauri's system libraries.
[workspace]

[lib]
name = "housewright_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
housewright-api = { path = "../../crates/api" }
housewright-core = { path = "../../crates/core" }
housewright-media = { path = "../../crates/media" }
tauri-plugin-reminders = { path = "plugins/reminders" }

[features]
default = ["ocr"]
# Label reading on the device (D-74): compiles the ~12 MB OCR models into
# the app. `--no-default-features` builds without it (to measure its size).
ocr = []

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true

# As in the workspace: pixel and model code is unusably slow unoptimised, so
# even the debug APK optimises these dependencies.
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
rqrr = { opt-level = 3 }
ocrs = { opt-level = 3 }
rten = { opt-level = 3 }
rten-base = { opt-level = 3 }
rten-gemm = { opt-level = 3 }
rten-simd = { opt-level = 3 }
rten-tensor = { opt-level = 3 }
rten-vecmath = { opt-level = 3 }
rten-imageproc = { opt-level = 3 }
rten-sequence = { opt-level = 3 }
rten-onnx = { opt-level = 3 }
# The binder's typesetter (D-80): unoptimised, a 30-page binder takes tens
# of seconds, which matters most in the debug APK on the emulator.
typst-library = { opt-level = 2 }
typst-layout = { opt-level = 2 }
typst-realize = { opt-level = 2 }
typst-eval = { opt-level = 2 }
typst-pdf = { opt-level = 2 }
typst-syntax = { opt-level = 2 }
typst-utils = { opt-level = 2 }
krilla = { opt-level = 2 }
rustybuzz = { opt-level = 2 }
ttf-parser = { opt-level = 2 }
comemo = { opt-level = 2 }
